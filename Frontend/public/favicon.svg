<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Metallic & Cinema Gradients -->
    <linearGradient id="camBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242936"/>
      <stop offset="45%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <linearGradient id="goldCineRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe17d"/>
      <stop offset="40%" stop-color="#e5a93c"/>
      <stop offset="85%" stop-color="#b37714"/>
      <stop offset="100%" stop-color="#f5c258"/>
    </linearGradient>

    <linearGradient id="lensGlassCoating" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#0077b6" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#0c1c38" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="camMetalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="recTallyGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="65%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#80050c"/>
    </radialGradient>

    <filter id="tallyBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Camera Body -->
  <rect x="5" y="14" width="54" height="42" rx="9" fill="url(#camBodyGrad)" stroke="url(#camMetalRim)" stroke-width="1.8"/>

  <!-- Top Pentaprism / Viewfinder Housing -->
  <path d="M 22 14 L 27 6 L 37 6 L 42 14 Z" fill="url(#camBodyGrad)" stroke="url(#camMetalRim)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Shutter Release Button -->
  <rect x="11" y="9" width="8" height="5" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>

  <!-- Control Dial (Right) -->
  <rect x="45" y="10" width="9" height="4" rx="1.5" fill="#334155" stroke="#1e293b" stroke-width="0.6"/>

  <!-- Pro Cinema Red Tally / Recording Indicator -->
  <circle cx="50" cy="22" r="3.2" fill="url(#recTallyGlow)" filter="url(#tallyBloom)"/>
  <circle cx="49" cy="21" r="1" fill="#ffffff" opacity="0.8"/>

  <!-- Main Cinema Lens Barrel (Outer Ring) -->
  <circle cx="32" cy="35" r="18" fill="#0f172a" stroke="url(#goldCineRing)" stroke-width="2.6"/>

  <!-- Stepped Focus Calibrations / Ring Marks -->
  <circle cx="32" cy="35" r="14.8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2 1.5"/>

  <!-- Anti-Reflective Optical Glass Element -->
  <circle cx="32" cy="35" r="12.8" fill="url(#lensGlassCoating)"/>

  <!-- Multi-blade Cinema Iris Aperture Blades -->
  <g fill="#070b14" opacity="0.82">
    <path d="M 32 23 L 38 31.5 L 31.5 29 Z"/>
    <path d="M 41.5 28.5 L 39 39 L 33 34 Z"/>
    <path d="M 40.5 40 L 32 42 L 33.5 35 Z"/>
    <path d="M 32 47 L 26 38.5 L 32.5 41 Z"/>
    <path d="M 22.5 41.5 L 25 31 L 31 36 Z"/>
    <path d="M 23.5 30 L 32 28 L 30.5 35 Z"/>
  </g>

  <!-- Central Aperture Pupil Hole -->
  <circle cx="32" cy="35" r="4.2" fill="#020408"/>

  <!-- Cine Lens Optical Flare Highlights -->
  <ellipse cx="27.5" cy="29.5" rx="3.6" ry="1.8" fill="#ffffff" opacity="0.7" transform="rotate(-35 27.5 29.5)"/>
  <circle cx="36.5" cy="40.5" r="1.3" fill="#00f0ff" opacity="0.85"/>
  <circle cx="26" cy="41" r="0.8" fill="#ffe17d" opacity="0.6"/>
</svg>